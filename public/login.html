<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập — Patuhi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="container py-4" style="max-width: 440px;">
    <div class="text-center mb-4">
      <a class="navbar-brand d-inline-flex align-items-center gap-2 text-decoration-none" href="/">
        <i class="bi bi-shop-window text-warning fs-2"></i>
        <span class="fs-2 fw-bold">PATUHI</span>
      </a>
      <p class="text-muted mt-1">Đăng nhập để khám phá mua bán đồ cũ</p>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5 bg-white">
      <h4 class="fw-bold mb-4 text-center">Đăng Nhập</h4>

      <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="form-label fw-semibold">Tên đăng nhập hoặc Email</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
            <input type="text" id="username" class="form-control" placeholder="admin hoặc vana@gmail.com" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Mật khẩu</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 rounded-pill shadow-sm" id="btn-login">
          Đăng Nhập
        </button>
      </form>

      <div class="text-center mt-4 text-muted small">
        Chưa có tài khoản? <a href="/register" class="text-warning fw-bold text-decoration-none">Đăng ký ngay</a>
      </div>

      <div class="mt-4 p-3 bg-light rounded-3 small text-muted">
        <strong>Tài khoản mẫu:</strong><br>
        • Quản trị viên: <code>admin</code> / <code>Admin123@password</code><br>
        • Thành viên: <code>nguyenvana</code> / <code>Password123@</code>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('login-alert');
      const btn = document.getElementById('btn-login');

      alertBox.classList.add('d-none');
      btn.disabled = true;
      btn.innerText = 'Đang kiểm tra...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.data.token);
          localStorage.setItem('user', JSON.stringify(data.data.user));
          PatuhiApp.showToast('Đăng nhập thành công!', 'success');

          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect') || (data.data.user.role === 'admin' ? '/admin' : '/');
          setTimeout(() => {
            window.location.href = redirect;
          }, 800);
        } else {
          alertBox.innerText = data.message || 'Đăng nhập không thành công!';
          alertBox.classList.remove('d-none');
          btn.disabled = false;
          btn.innerText = 'Đăng Nhập';
        }
      } catch (err) {
        alertBox.innerText = 'Lỗi kết nối máy chủ.';
        alertBox.classList.remove('d-none');
        btn.disabled = false;
        btn.innerText = 'Đăng Nhập';
      }
    }
  </script>
</body>
</html>
