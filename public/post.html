<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Tin Bán Đồ — Patuhi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .upload-box {
      border: 2px dashed #ced4da;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
      transition: all 0.2s;
    }
    .upload-box:hover {
      border-color: var(--primary-color);
      background: #fff8f0;
    }
    .preview-img-item {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #ddd;
    }
    .preview-img-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preview-img-item .btn-remove-img {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-2">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <i class="bi bi-shop-window text-warning fs-3"></i>
        <span>PATUHI</span>
      </a>
      <div id="nav-auth-container" class="ms-auto"></div>
    </div>
  </nav>

  <main class="container py-4 max-w-800">
    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
      <div class="d-flex align-items-center gap-2 mb-4 pb-2 border-bottom">
        <i class="bi bi-pencil-square text-warning fs-3"></i>
        <h4 class="fw-bold mb-0" id="form-heading">Đăng tin bán sản phẩm mới</h4>
      </div>

      <form id="post-product-form" onsubmit="handleProductSubmit(event)">
        <!-- Hình ảnh -->
        <div class="mb-4">
          <label class="form-label fw-bold">Hình ảnh sản phẩm (Tối đa 5 ảnh) <span class="text-danger">*</span></label>
          <div class="upload-box mb-3" onclick="document.getElementById('image-input').click()">
            <i class="bi bi-cloud-arrow-up text-warning fs-1"></i>
            <h6 class="fw-semibold mt-2 mb-1">Bấm để tải ảnh lên</h6>
            <span class="text-muted small">Định dạng JPG, PNG, WEBP (Tối đa 5MB mỗi ảnh)</span>
            <input type="file" id="image-input" multiple accept="image/*" class="d-none" onchange="handleImageSelection(this)">
          </div>

          <!-- Existing Images (khi sửa) -->
          <div id="existing-images-container" class="d-flex flex-wrap gap-2 mb-2"></div>

          <!-- New Selected Images Preview -->
          <div id="new-images-preview" class="d-flex flex-wrap gap-2"></div>
        </div>

        <!-- Tiêu đề -->
        <div class="mb-3">
          <label for="post-title" class="form-label fw-bold">Tiêu đề tin đăng <span class="text-danger">*</span></label>
          <input type="text" class="form-control form-control-lg fs-6" id="post-title" required minlength="5" maxlength="200" placeholder="Ví dụ: iPhone 13 Pro Max 128GB màu xanh chính hãng...">
          <div class="form-text">Tiêu đề rõ ràng giúp tin của bạn tiếp cận người mua tốt hơn (5-200 ký tự).</div>
        </div>

        <div class="row g-3 mb-3">
          <!-- Danh mục -->
          <div class="col-md-6">
            <label for="post-category" class="form-label fw-bold">Danh mục <span class="text-danger">*</span></label>
            <select class="form-select" id="post-category" required>
              <option value="">-- Chọn danh mục --</option>
            </select>
          </div>

          <!-- Tình trạng -->
          <div class="col-md-6">
            <label for="post-condition" class="form-label fw-bold">Tình trạng <span class="text-danger">*</span></label>
            <select class="form-select" id="post-condition" required>
              <option value="used">Đã qua sử dụng</option>
              <option value="like_new">Như mới 99%</option>
              <option value="new">Mới 100% (Nguyên seal/hộp)</option>
            </select>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <!-- Giá bán -->
          <div class="col-md-6">
            <label for="post-price" class="form-label fw-bold">Giá bán (VNĐ) <span class="text-danger">*</span></label>
            <div class="input-group">
              <input type="number" class="form-control" id="post-price" min="0" step="1000" required placeholder="0">
              <span class="input-group-text">đ</span>
            </div>
          </div>

          <!-- Số điện thoại liên hệ -->
          <div class="col-md-6">
            <label for="post-phone" class="form-label fw-bold">Số điện thoại liên hệ</label>
            <input type="tel" class="form-control" id="post-phone" placeholder="09xxxxxxxx">
          </div>
        </div>

        <!-- Địa điểm -->
        <div class="mb-3">
          <label for="post-location" class="form-label fw-bold">Địa chỉ / Khu vực người bán <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="post-location" required placeholder="Ví dụ: Quận Cầu Giấy, Hà Nội hoặc Quận 1, TP.HCM">
        </div>

        <!-- Mô tả -->
        <div class="mb-4">
          <label for="post-description" class="form-label fw-bold">Mô tả chi tiết <span class="text-danger">*</span></label>
          <textarea class="form-control" id="post-description" rows="5" required minlength="10" placeholder="Mô tả nguồn gốc, tình trạng bảo hành, phụ kiện đi kèm, lý do bán..."></textarea>
        </div>

        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
          <a href="/" class="btn btn-light rounded-pill px-4">Hủy bỏ</a>
          <button type="submit" class="btn btn-warning text-dark fw-bold rounded-pill px-5" id="btn-submit-post">
            Đăng tin ngay
          </button>
        </div>
      </form>
    </div>
  </main>

  <footer class="bg-white border-top py-4 mt-auto">
    <div class="container text-center text-muted small">
      <p class="mb-0">Patuhi Marketplace &copy; 2026</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/post-product.js"></script>
</body>
</html>
