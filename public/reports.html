<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Sử Báo Cáo Vi Phạm — Patuhi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-2">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <i class="bi bi-shop-window text-warning fs-3"></i>
        <span>PATUHI</span>
      </a>
      <div id="nav-auth-container" class="ms-auto"></div>
    </div>
  </nav>

  <main class="container py-4 max-w-900">
    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
      <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <h4 class="fw-bold mb-0 text-danger">
          <i class="bi bi-flag-fill me-2"></i>Lịch sử báo cáo vi phạm của bạn
        </h4>
        <span class="text-muted small" id="report-count-text">0 báo cáo</span>
      </div>

      <div id="reports-container">
        <div class="text-center py-5 text-muted">Đang tải lịch sử báo cáo...</div>
      </div>
    </div>
  </main>

  <footer class="bg-white border-top py-4 mt-auto">
    <div class="container text-center text-muted small">
      <p class="mb-0">Patuhi Marketplace &copy; 2026</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await PatuhiApp.checkAuth();
      if (!user) {
        window.location.href = '/login?redirect=/my-reports';
        return;
      }
      loadMyReports();
    });

    async function loadMyReports() {
      const container = document.getElementById('reports-container');
      const countText = document.getElementById('report-count-text');

      try {
        const res = await fetch('/api/reports/my-reports', {
          headers: {
            'Authorization': `Bearer ${localStorage.getItem('token') || ''}`
          }
        });
        const json = await res.json();
        if (!res.ok) {
          container.innerHTML = `<div class="alert alert-danger">${json.message}</div>`;
          return;
        }

        const reports = json.data.reports;
        countText.innerText = `${reports.length} báo cáo`;

        if (reports.length === 0) {
          container.innerHTML = `
            <div class="text-center py-5 text-muted">
              <i class="bi bi-shield-check fs-1 text-success mb-2"></i>
              <h6>Bạn chưa gửi báo cáo vi phạm nào!</h6>
              <p class="small">Cảm ơn bạn đã luôn đồng hành cùng Patuhi xây dựng môi trường mua bán văn minh, an toàn.</p>
            </div>
          `;
          return;
        }

        const reasonMap = {
          'fraud': 'Lừa đảo, nhận cọc không giao',
          'fake': 'Hàng giả, hàng nhái, sai sự thật',
          'offensive': 'Nội dung phản cảm, thô tục',
          'wrong_category': 'Sai danh mục',
          'other': 'Lý do khác'
        };

        const statusBadgeMap = {
          'pending': '<span class="badge bg-warning text-dark"><i class="bi bi-hourglass-split me-1"></i>Đang chờ tiếp nhận</span>',
          'reviewed': '<span class="badge bg-info text-dark"><i class="bi bi-search me-1"></i>Đang xác minh</span>',
          'resolved': '<span class="badge bg-success"><i class="bi bi-check-circle me-1"></i>Đã xử lý (Đã gỡ tin vi phạm)</span>',
          'dismissed': '<span class="badge bg-secondary"><i class="bi bi-x-circle me-1"></i>Bác bỏ (Không vi phạm)</span>'
        };

        container.innerHTML = `
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Sản phẩm bị báo cáo</th>
                  <th>Lý do</th>
                  <th>Trạng thái xử lý</th>
                  <th>Phản hồi của BQT</th>
                  <th>Ngày gửi</th>
                </tr>
              </thead>
              <tbody>
                ${reports.map(r => {
                  const p = r.product;
                  const img = p && p.images && p.images[0] ? p.images[0].image_url : 'https://placehold.co/60x60';
                  return `
                    <tr>
                      <td>
                        ${p ? `
                          <div class="d-flex align-items-center gap-2">
                            <img src="${img}" width="45" height="45" class="rounded" style="object-fit:cover;">
                            <a href="/product/${p.id}" class="fw-semibold text-dark text-decoration-none text-truncate" style="max-width: 200px;">
                              ${p.title}
                            </a>
                          </div>
                        ` : '<span class="text-muted">(Sản phẩm đã bị xóa)</span>'}
                      </td>
                      <td>
                        <span class="fw-semibold text-danger">${reasonMap[r.reason] || r.reason}</span>
                        ${r.description ? `<p class="text-muted small mb-0 mt-1">${r.description}</p>` : ''}
                      </td>
                      <td>${statusBadgeMap[r.status] || r.status}</td>
                      <td>
                        <span class="small text-secondary">${r.admin_note || 'Chưa có ghi chú'}</span>
                      </td>
                      <td class="text-muted small">${PatuhiApp.formatTimeAgo(r.created_at)}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (e) {
        container.innerHTML = '<div class="alert alert-danger">Lỗi khi tải lịch sử báo cáo.</div>';
      }
    }
  </script>
</body>
</html>
