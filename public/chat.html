<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tin Nhắn Trực Tuyến — Patuhi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-2">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <i class="bi bi-shop-window text-warning fs-3"></i>
        <span>PATUHI</span>
      </a>
      <div id="nav-auth-container" class="ms-auto"></div>
    </div>
  </nav>

  <main class="container py-3">
    <div class="row g-0 chat-container shadow-sm">
      <!-- Left Column: Conversations List -->
      <div class="col-md-4 col-lg-4 chat-list bg-white">
        <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
          <h5 class="fw-bold mb-0"><i class="bi bi-chat-left-text text-warning me-2"></i>Trò chuyện</h5>
        </div>
        <div id="conversations-list">
          <div class="text-center py-5 text-muted">Đang tải cuộc trò chuyện...</div>
        </div>
      </div>

      <!-- Right Column: Active Conversation Chat Box -->
      <div class="col-md-8 col-lg-8 d-flex flex-column bg-white h-100 position-relative" id="chat-box-wrapper">
        <!-- Chat Header -->
        <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-light" id="chat-header">
          <div class="d-flex align-items-center gap-3">
            <img id="chat-other-avatar" src="/uploads/avatars/default.png" class="rounded-circle" width="45" height="45" style="object-fit:cover;">
            <div>
              <h6 class="fw-bold mb-0" id="chat-other-name">Chọn cuộc trò chuyện</h6>
              <span class="text-muted small" id="chat-other-status">Chưa chọn</span>
            </div>
          </div>
          <div class="d-flex align-items-center gap-2">
            <div id="chat-product-preview" class="d-flex align-items-center gap-2 bg-white px-2 py-1 rounded border">
              <!-- Product small snippet -->
            </div>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="toggle-chat-sound" onclick="toggleChatSound()" aria-label="Tắt âm báo tin nhắn" title="Tắt âm báo tin nhắn">
              <i class="bi bi-volume-up-fill" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <!-- Messages Stream -->
        <div class="chat-messages flex-grow-1" id="messages-container">
          <div class="text-center py-5 text-muted">
            <i class="bi bi-chat-square-dots fs-1 mb-2"></i>
            <h6>Chọn một cuộc trò chuyện từ danh sách bên trái để bắt đầu nhắn tin!</h6>
          </div>
        </div>

        <!-- Chat Input Form -->
        <div id="image-preview-container" class="d-none px-3 pt-2 bg-white align-items-center gap-2">
          <img id="image-preview" src="" alt="Ảnh xem trước" width="48" height="48" class="rounded border" style="object-fit: cover;">
          <span id="image-preview-name" class="small text-muted text-truncate flex-grow-1"></span>
          <button type="button" class="btn btn-sm btn-outline-secondary" onclick="cancelImagePreview()" title="Bỏ ảnh đã chọn" aria-label="Bỏ ảnh đã chọn"><i class="bi bi-x-lg"></i></button>
        </div>
        <form class="p-3 border-top bg-white d-flex gap-2 align-items-center" id="message-form" onsubmit="handleSendMessage(event)">
          <input type="file" id="chat-image-input" class="d-none" accept="image/jpeg,image/png,image/webp,image/gif" onchange="handleImageSelected(event)">
          <button type="button" class="btn btn-outline-secondary rounded-circle p-2" id="btn-attach-image" onclick="document.getElementById('chat-image-input').click()" disabled style="width: 42px; height: 42px;" title="Gửi ảnh" aria-label="Gửi ảnh"><i class="bi bi-paperclip"></i></button>
          <input type="text" class="form-control rounded-pill px-3" id="message-input" placeholder="Nhập tin nhắn..." autocomplete="off" disabled>
          <button type="submit" class="btn btn-warning rounded-circle p-2" id="btn-send-msg" disabled style="width: 42px; height: 42px;">
            <i class="bi bi-send-fill text-dark"></i>
          </button>
        </form>
      </div>
    </div>
  </main>

  <div class="modal fade" id="chatImageModal" tabindex="-1" aria-labelledby="chatImageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content bg-dark border-0">
        <div class="modal-header border-0 position-absolute top-0 end-0" style="z-index: 1;">
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Đóng ảnh"></button>
        </div>
        <div class="modal-body p-2 d-flex justify-content-center align-items-center" style="min-height: 50vh;">
          <img id="chat-image-modal-content" src="" alt="Ảnh tin nhắn phóng to" class="img-fluid" style="max-height: 85vh; object-fit: contain;">
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
