<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tin Nhắn Trực Tuyến — Patuhi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-2">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <i class="bi bi-shop-window text-warning fs-3"></i>
        <span>PATUHI</span>
      </a>
      <div id="nav-auth-container" class="ms-auto"></div>
    </div>
  </nav>

  <main class="container py-3">
    <div class="row g-0 chat-container shadow-sm">
      <!-- Left Column: Conversations List -->
      <div class="col-md-4 col-lg-4 chat-list bg-white">
        <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
          <h5 class="fw-bold mb-0"><i class="bi bi-chat-left-text text-warning me-2"></i>Trò chuyện</h5>
        </div>
        <div id="conversations-list">
          <div class="text-center py-5 text-muted">Đang tải cuộc trò chuyện...</div>
        </div>
      </div>

      <!-- Right Column: Active Conversation Chat Box -->
      <div class="col-md-8 col-lg-8 d-flex flex-column bg-white h-100 position-relative" id="chat-box-wrapper">
        <!-- Chat Header -->
        <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-light" id="chat-header">
          <div class="d-flex align-items-center gap-3">
            <img id="chat-other-avatar" src="/uploads/avatars/default.png" class="rounded-circle" width="45" height="45" style="object-fit:cover;">
            <div>
              <h6 class="fw-bold mb-0" id="chat-other-name">Chọn cuộc trò chuyện</h6>
              <span class="text-muted small" id="chat-other-status">Chưa chọn</span>
            </div>
          </div>
          <div id="chat-product-preview" class="d-flex align-items-center gap-2 bg-white px-2 py-1 rounded border">
            <!-- Product small snippet -->
          </div>
        </div>

        <!-- Messages Stream -->
        <div class="chat-messages flex-grow-1" id="messages-container">
          <div class="text-center py-5 text-muted">
            <i class="bi bi-chat-square-dots fs-1 mb-2"></i>
            <h6>Chọn một cuộc trò chuyện từ danh sách bên trái để bắt đầu nhắn tin!</h6>
          </div>
        </div>

        <!-- Chat Input Form -->
        <form class="p-3 border-top bg-white d-flex gap-2 align-items-center" id="message-form" onsubmit="handleSendMessage(event)">
          <input type="text" class="form-control rounded-pill px-3" id="message-input" placeholder="Nhập tin nhắn..." autocomplete="off" disabled>
          <button type="submit" class="btn btn-warning rounded-circle p-2" id="btn-send-msg" disabled style="width: 42px; height: 42px;">
            <i class="bi bi-send-fill text-dark"></i>
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
