            <div class="seller-profile-identity">

              <div class="seller-profile-details">
                <div class="seller-profile-name-row"><h1 id="seller-name"></h1></div>
                <div class="seller-profile-meta">

                  <span class="seller-profile-separator" aria-hidden="true">•</span>

                  <span class="seller-profile-separator" aria-hidden="true">•</span>
                  <div class="seller-profile-followers">Người theo dõi: <span id="seller-followers"></span></div>
                </div>
                <div class="seller-profile-reputation">
                  <div class="seller-profile-rating" id="seller-rating">
                    <span class="seller-profile-rating-value" id="seller-rating-value"></span>
                    <svg viewBox="0 0 24 25" width="20" height="20" fill="currentColor" class="seller-profile-star" aria-hidden="true"><use href="#profile-icon-2"/></svg>

                  </div>
                  <span class="seller-profile-separator" aria-hidden="true">•</span>
                  <div class="seller-profile-membership">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><use href="#profile-icon-3"/></svg>
                    <span>Đã tham gia: <span id="seller-joined"></span></span>
                  </div>
                </div>
                <div class="seller-profile-actions">
                  <div class="seller-profile-location">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><use href="#profile-icon-4"/></svg>
                    <span id="seller-location"></span>
                  </div>
                  <button type="button" class="seller-profile-action" id="seller-share">
                    <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" aria-hidden="true"><use href="#profile-icon-5"/></svg><span>Chia sẻ</span>
                  </button>
                  <button type="button" class="seller-profile-action" id="seller-follow" aria-pressed="false">
                    <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" aria-hidden="true"><use href="#profile-icon-6"/></svg><span id="seller-follow-label">Theo dõi</span>
                  </button>
                </div>
              </div>
            </div>
            <div class="seller-profile-menu dropdown">

            </div>

          <button type="button" class="seller-ads-filter" data-status="sold" aria-pressed="false">Đã bán ( 0 )</button>
