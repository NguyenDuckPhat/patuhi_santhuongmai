<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản Phẩm Yêu Thích — Patuhi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-2">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <i class="bi bi-shop-window text-warning fs-3"></i>
        <span>PATUHI</span>
      </a>
      <div id="nav-auth-container" class="ms-auto"></div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold mb-0 text-danger">
        <i class="bi bi-heart-fill me-2"></i>Tin đăng đã lưu yêu thích
      </h4>
      <span class="text-muted small" id="fav-count-text">0 sản phẩm</span>
    </div>

    <!-- Product Grid -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3" id="favorites-list">
      <div class="col-12 text-center py-5 text-muted">Đang tải danh sách yêu thích...</div>
    </div>
  </main>

  <footer class="bg-white border-top py-4 mt-auto">
    <div class="container text-center text-muted small">
      <p class="mb-0">Patuhi Marketplace &copy; 2026</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await PatuhiApp.checkAuth();
      if (!user) {
        window.location.href = '/login?redirect=/favorites';
        return;
      }
      loadFavorites();
    });

    async function loadFavorites() {
      const listContainer = document.getElementById('favorites-list');
      const countText = document.getElementById('fav-count-text');

      try {
        const res = await fetch('/api/favorites', {
          headers: {
            'Authorization': `Bearer ${localStorage.getItem('token') || ''}`
          }
        });
        const json = await res.json();
        if (!res.ok) {
          listContainer.innerHTML = `<div class="col-12 alert alert-danger">${json.message}</div>`;
          return;
        }

        const favs = json.data.favorites;
        countText.innerText = `${favs.length} sản phẩm`;

        if (favs.length === 0) {
          listContainer.innerHTML = `
            <div class="col-12 text-center py-5 text-muted">
              <i class="bi bi-heartbreak fs-1 mb-2"></i>
              <h5>Bạn chưa lưu sản phẩm nào!</h5>
              <p class="small">Bấm vào biểu tượng trái tim ở góc mỗi tin đăng để lưu lại xem sau.</p>
              <a href="/" class="btn btn-warning rounded-pill px-4 fw-bold">Khám phá sản phẩm</a>
            </div>
          `;
          return;
        }

        listContainer.innerHTML = favs.map(p => {
          const img = (p.images && p.images.length > 0) ? p.images[0].image_url : 'https://placehold.co/400x300';
          return `
            <div class="col" id="fav-card-${p.id}">
              <div class="product-card">
                <div class="product-img-wrapper">
                  <a href="/product/${p.id}"><img src="${img}" alt="${p.title}"></a>
                  <button class="btn-favorite-icon active" onclick="removeFav(${p.id})">
                    <i class="bi bi-heart-fill"></i>
                  </button>
                </div>
                <div class="p-3 d-flex flex-column flex-grow-1">
                  <h6 class="fw-bold mb-1 text-truncate"><a href="/product/${p.id}" class="text-dark text-decoration-none">${p.title}</a></h6>
                  <div class="product-price mb-2">${PatuhiApp.formatPrice(p.price)}</div>
                  <div class="mt-auto d-flex justify-content-between align-items-center text-muted small pt-2 border-top">
                    <span><i class="bi bi-geo-alt me-1"></i>${p.location}</span>
                    <button class="btn btn-sm btn-outline-danger" onclick="removeFav(${p.id})">Bỏ lưu</button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        listContainer.innerHTML = '<div class="col-12 alert alert-danger">Lỗi kết nối khi tải yêu thích.</div>';
      }
    }

    async function removeFav(productId) {
      try {
        const res = await fetch(`/api/favorites/${productId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${localStorage.getItem('token') || ''}`
          }
        });
        if (res.ok) {
          PatuhiApp.showToast('Đã xóa khỏi danh sách yêu thích!', 'info');
          document.getElementById(`fav-card-${productId}`)?.remove();
          loadFavorites();
        }
      } catch (e) {
        PatuhiApp.showToast('Lỗi khi xóa yêu thích', 'danger');
      }
    }
  </script>
</body>
</html>
