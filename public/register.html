<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản — Patuhi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="container py-4" style="max-width: 480px;">
    <div class="text-center mb-4">
      <a class="navbar-brand d-inline-flex align-items-center gap-2 text-decoration-none" href="/">
        <i class="bi bi-shop-window text-warning fs-2"></i>
        <span class="fs-2 fw-bold">PATUHI</span>
      </a>
      <p class="text-muted mt-1">Đăng ký tài khoản thành viên miễn phí</p>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5 bg-white">
      <h4 class="fw-bold mb-4 text-center">Tạo Tài Khoản</h4>

      <div id="register-alert" class="alert alert-danger d-none" role="alert"></div>

      <!-- Đăng ký nhanh trực tiếp bằng Google OAuth 2.0 -->
      <div class="mb-3">
        <a href="/api/auth/google/url" class="btn btn-white border w-100 py-2 rounded-pill fw-semibold shadow-sm d-flex align-items-center justify-content-center gap-2 text-decoration-none text-dark hover-shadow" id="btn-google-register">
          <svg width="20" height="20" viewBox="0 0 18 18">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
          </svg>
          <span>Đăng ký nhanh với Google</span>
        </a>
      </div>

      <div class="position-relative my-4 text-center">
        <hr class="text-muted">
        <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">hoặc điền thông tin</span>
      </div>

      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="mb-3">
          <label class="form-label fw-semibold">Họ và tên (*)</label>
          <input type="text" id="full_name" class="form-control" placeholder="Nguyễn Văn A" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Tên đăng nhập (*)</label>
          <input type="text" id="username" class="form-control" placeholder="nguyenvana (chỉ chữ và số)" required minlength="3">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Email (*)</label>
          <input type="email" id="email" class="form-control" placeholder="email@example.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Số điện thoại</label>
          <input type="tel" id="phone" class="form-control" placeholder="09xxxxxxxx">
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Mật khẩu (*)</label>
          <input type="password" id="password" class="form-control" placeholder="Tối thiểu 6 ký tự" required minlength="6">
        </div>

        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 rounded-pill shadow-sm" id="btn-register">
          Đăng Ký Tài Khoản
        </button>
      </form>

      <div class="text-center mt-4 text-muted small">
        Đã có tài khoản? <a href="/login" class="text-warning fw-bold text-decoration-none">Đăng nhập ngay</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const errorMsg = urlParams.get('error');
      if (errorMsg) {
        const alertBox = document.getElementById('register-alert');
        if (alertBox) {
          alertBox.innerText = decodeURIComponent(errorMsg);
          alertBox.classList.remove('d-none');
        }
      }
    });

    async function handleRegister(e) {
      e.preventDefault();
      const full_name = document.getElementById('full_name').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;

      const alertBox = document.getElementById('register-alert');
      const btn = document.getElementById('btn-register');

      alertBox.classList.add('d-none');
      btn.disabled = true;
      btn.innerText = 'Đang xử lý...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ full_name, username, email, phone, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.data.token);
          localStorage.setItem('user', JSON.stringify(data.data.user));
          PatuhiApp.showToast('Đăng ký tài khoản thành công!', 'success');
          setTimeout(() => {
            window.location.href = '/';
          }, 800);
        } else {
          alertBox.innerText = data.message || 'Đăng ký thất bại!';
          alertBox.classList.remove('d-none');
          btn.disabled = false;
          btn.innerText = 'Đăng Ký Tài Khoản';
        }
      } catch (err) {
        alertBox.innerText = 'Lỗi kết nối máy chủ.';
        alertBox.classList.remove('d-none');
        btn.disabled = false;
        btn.innerText = 'Đăng Ký Tài Khoản';
      }
    }
  </script>
</body>
</html>
